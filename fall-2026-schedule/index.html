const COURSES=[
{id:'film240',title:'FILM 240',name:'Hermeneutics of Doubt: Media, Philosophy, Meaning',instructor:'Weihong Bao',location:'Dwinelle 226',day:'周一',start:'09:30',end:'12:29',description:'This graduate seminar considers doubt as historically varied modes of inquiry and understanding that unsettle a determinist worldview. We will trace a genealogy of doubt by placing the history of philosophy in conversation with the philosophy of technology. Readings include René Descartes, Immanuel Kant, Charles Peirce, Bernard Stiegler, Hans-Georg Gadamer, Martin Heidegger, Maurice Merleau-Ponty, Paul Ricoeur, Jacques Derrida, Ian Hacking, Karen Barad, among others.'},
{id:'film1251',title:'FILM 125',name:'Documentary Forms',instructor:'Luis Madrigal',location:'Dwinelle 142',day:'周一',start:'11:00',end:'12:29',description:'This course surveys the history, theory, and form of the documentary film. It examines major modes of documentary filmmaking, including cinema verité, direct cinema, investigative documentary, ethnographic film, autobiography, and the personal essay, as well as forms that question the relationship between fact and fiction.'},
{id:'film301',title:'FILM 30',name:'Film History & Form II',instructor:'Matthew Hubbell',location:'Dwinelle 142',day:'周一',start:'12:30',end:'13:59',description:'This course will focus on topics in the history, theory and aesthetics of sound cinema.'},
{id:'film203',title:'FILM 203',name:'Film Studies Proseminar',instructor:'Kristen Whissel',location:'Dwinelle 226',day:'周一',start:'14:00',end:'18:00',description:'A seminar introducing Film Studies graduate students to the field, the profession, and the faculty practicing film studies. Introduces students to the intellectual and physical resources of the Berkeley campus as well as the Bay Area.'},
{id:'nwmedia201-lec',title:'NWMEDIA 201',name:'Questioning New Media',component:'LEC 001',classNumber:'29717',instructor:'Asma Kazmi',location:'Jacobs Hall 10',day:'周二',start:'09:00',end:'11:59',description:'Held in conjunction with the Art, Technology, and Culture Colloquium. Students enhance skills in thinking critically about new media, researching pioneering work, forming incisive questions, and evaluating and creating effective presentations.'},
{id:'film-media-theory-tu',title:'FILM 20',name:'Film and Media Theory',instructor:'Weihong Bao',location:'Berkeley Art Museum 1T75',locationUrl:'http://www.berkeley.edu/map/?q=bampfa',day:'周二',start:'09:30',end:'10:59',dates:'Aug 26, 2026 – Dec 11, 2026',classNumber:'22069',description:'Aug 26, 2026 – Dec 11, 2026 · Class #22069.'},
{id:'film1351',title:'FILM 135',name:'Exp., Alternative, and Radical Indigenous Media',instructor:'Mark Allen Minch-de Leon',location:'Dwinelle 142',day:'周二',start:'12:30',end:'13:59',description:'This course explores both the limits and capaciousness of the terms “experimental” and “media” from a critical Indigenous media theory perspective, including interventions that blur the boundaries between experimental, alternative, and radical media production.'},
{id:'geog255',title:'GEOG 255',name:'Space, Visuality, and the Refusal of Catastrophe',instructor:'Sharad Chari',location:'McCone 583',day:'周二',start:'15:00',end:'17:59',description:'This course addresses the contradiction between resistant ways of seeing and the hyper-visibilization of forms of emplaced and embodied violence, with tools from Marxist geography’s dialectical approach to space.'},
{id:'film1252',title:'FILM 125',name:'Documentary Forms',instructor:'Luis Madrigal',location:'Dwinelle 142',day:'周三',start:'11:00',end:'12:29',description:'This course surveys the history, theory, and form of the documentary film, including forms that question the relationship between fact and fiction.'},
{id:'film302',title:'FILM 30',name:'Film History & Form II',instructor:'Matthew Hubbell',location:'Dwinelle 142',day:'周三',start:'12:30',end:'13:59',description:'This course will focus on topics in the history, theory and aesthetics of sound cinema.'},
{id:'rhetor145',title:'RHETOR 145',name:'Ecology Across the Arts',instructor:'Shannon Jackson',location:'Hearst Field Annex B5',day:'周三',start:'14:00',end:'16:59',description:'This course examines critical discussions of narrative, images, science, social movements, and aesthetic practices surrounding ecology and climate change.'},
{id:'hist280u',title:'HISTORY 280U',name:'Nature, Power, and Technology',instructor:'Matthew Shutzer',location:'Dwinelle 3205',day:'周三',start:'16:00',end:'17:59',description:'This course reconsiders the trajectories of environmental thought and environmentalism in the twentieth century through deeper engagement with the history and philosophy of technology.'},
{id:'film-media-theory-th',title:'FILM 20',name:'Film and Media Theory',instructor:'Weihong Bao',location:'Berkeley Art Museum 1T75',locationUrl:'http://www.berkeley.edu/map/?q=bampfa',day:'周四',start:'09:30',end:'10:59',dates:'Aug 26, 2026 – Dec 11, 2026',classNumber:'22069',description:'Aug 26, 2026 – Dec 11, 2026 · Class #22069.'},
{id:'nwmedia201-col',title:'NWMEDIA 201',name:'Questioning New Media',component:'COL 101',classNumber:'29986',instructor:'Asma Kazmi',location:'Jacobs Hall 10',day:'周四',start:'12:00',end:'12:59',description:'Colloquium component associated with Questioning New Media.'},
{id:'film1352',title:'FILM 135',name:'Exp., Alternative, and Radical Indigenous Media',instructor:'Mark Allen Minch-de Leon',location:'Dwinelle 142',day:'周四',start:'12:30',end:'13:59',description:'This course explores experimental, alternative, and radical Indigenous media from a critical Indigenous media theory perspective.'},
{id:'film200-sem',title:'FILM 200',name:'Graduate Film Theory Seminar',component:'SEM',instructor:'Iggy Cortez',location:'Dwinelle 226',day:'周四',start:'14:00',end:'16:59',description:'This seminar examines traditional and recent critical approaches to film theory, including structuralist-semiotic, psychoanalytical, socio-critical, and classical debates about representation, signification, sexual difference, and the social function of images.'},
{id:'film200-dis',title:'FILM 200',name:'Graduate Film Theory Seminar',component:'DIS',instructor:'Iggy Cortez',location:'Dwinelle 226',day:'周四',start:'17:00',end:'17:59',description:'Discussion component associated with FILM 200.'}
];
const DEFAULT_ACTIVE=['FILM 200','FILM 203','GEOG 255','NWMEDIA 201'];
const active=new Set(DEFAULT_ACTIVE),titles=[...new Set(COURSES.map(c=>c.title))],color=Object.fromEntries(titles.map((t,i)=>[t,COLORS[i%COLORS.length]]));const $=s=>document.querySelector(s),stage=$('#stage'),filters=$('#filters'),status=$('#status'),sheet=$('#sheet'),sheetBg=$('#sheetBg'),sheetBody=$('#sheetBody');
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function H(t){let[h,m]=t.split(':').map(Number);return h+m/60}function P(h){return((h-START)/(END-START))*100}function F(t){let[h,m]=t.split(':').map(Number),a=h>=12?'PM':'AM';return`${h%12||12}:${String(m).padStart(2,'0')} ${a}`}
function layout(rows){let r=rows.map(c=>({...c,s:H(c.start),e:H(c.end),col:0,n:1}));DAYS.forEach(day=>{let a=r.filter(c=>c.day===day).sort((x,y)=>x.s-y.s||(y.e-y.s)-(x.e-x.s)),cols=[];a.forEach(c=>{let ok=false;for(let i=0;i<cols.length;i++){if(!cols[i].some(x=>c.s<x.e&&c.e>x.s)){cols[i].push(c);c.col=i;ok=true;break}}if(!ok){c.col=cols.length;cols.push([c])}});a.forEach(c=>{let q=a.filter(x=>c.s<x.e&&c.e>x.s);c.n=Math.max(1,...q.map(x=>x.col+1))})});return r}
function renderFilters(){filters.innerHTML='';titles.forEach(t=>{let checked=active.has(t),l=document.createElement('label');l.className='filter';l.style.opacity=checked?'1':'.4';l.innerHTML=`<input type="checkbox" ${checked?'checked':''}><span class="dot" style="background:${color[t]}"></span><span>${esc(t)}</span>`;let i=l.querySelector('input');i.onchange=()=>{i.checked?active.add(t):active.delete(t);l.style.opacity=i.checked?'1':'.4';render()};filters.appendChild(l)})}
function render(){let rows=layout(COURSES.filter(c=>active.has(c.title)));stage.innerHTML='<div class="corner"></div>';DAYS.forEach((d,i)=>{let h=document.createElement('div');h.className='dayhead';h.style.left=`calc(var(--time) + ${i} * var(--day))`;h.textContent=d;stage.appendChild(h)});let axis=document.createElement('div');axis.className='axis';for(let h=START;h<=END;h++){let t=document.createElement('div');t.className='tl';t.style.top=P(h)+'%';t.textContent=`${h>12?h-12:h}:00 ${h>=12?'PM':'AM'}`;axis.appendChild(t)}stage.appendChild(axis);let g=document.createElement('div');g.className='grid';for(let h=START;h<=END;h++){let x=document.createElement('div');x.className='hour';x.style.top=P(h)+'%';g.appendChild(x);if(h<END){let y=document.createElement('div');y.className='half';y.style.top=P(h+.5)+'%';g.appendChild(y)}}for(let i=1;i<5;i++){let v=document.createElement('div');v.className='vline';v.style.left=`calc(${i} * var(--day))`;g.appendChild(v)}rows.forEach(c=>{let e=document.createElement('article'),di=DAYS.indexOf(c.day),cw=100/c.n,lp=c.col*cw;e.className='event';e.style.left=`calc(${di} * var(--day) + (${lp}% / 5) + 2px)`;e.style.width=`calc((${cw}% / 5) - 4px)`;e.style.top=P(c.s)+'%';e.style.height=Math.max(2.2,P(c.e)-P(c.s))+'%';e.style.background=color[c.title];let parts=[];if(c.component)parts.push(c.component);if(c.name&&c.name!==c.title)parts.push(c.name);let name=parts.length?`<div class="name">${parts.map(esc).join(' · ')}</div>`:'';e.innerHTML=`<strong>${esc(c.title)}</strong>${name}<div class="time">${esc(c.start)}–${esc(c.end)}</div>`;e.onclick=()=>openSheet(c);g.appendChild(e)});stage.appendChild(g);status.textContent=`${new Set(rows.map(c=>c.title)).size} 门课程 · ${rows.length} 个时段`}
function openSheet(c){let loc=c.locationUrl?`<a href="${esc(c.locationUrl)}" target="_blank" rel="noopener">${esc(c.location)}</a>`:esc(c.location);let extra='';if(c.component)extra+=`<span>${esc(c.component)}</span>`;if(c.dates)extra+=`<span>${esc(c.dates)}</span>`;if(c.classNumber)extra+=`<span>Class #${esc(c.classNumber)}</span>`;sheetBody.innerHTML=`<div class="course">${esc(c.title)}</div>${c.name&&c.name!==c.title?`<div class="cname">${esc(c.name)}</div>`:''}<div class="meta"><span>${esc(c.day)} · ${F(c.start)}–${F(c.end)}</span><span>${esc(c.instructor)}</span><span>${loc}</span>${extra}</div><div class="desc">${esc(c.description)}</div>`;sheet.classList.add('open');sheetBg.classList.add('open')}function closeSheet(){sheet.classList.remove('open');sheetBg.classList.remove('open')}$('#close').onclick=closeSheet;sheetBg.onclick=closeSheet;renderFilters();render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent),standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;if(isIOS&&!standalone&&!localStorage.getItem('ios-hint-dismissed'))setTimeout(()=>$('#ios').style.display='block',1000);$('#iosClose').onclick=()=>{$('#ios').style.display='none';localStorage.setItem('ios-hint-dismissed','1')};
